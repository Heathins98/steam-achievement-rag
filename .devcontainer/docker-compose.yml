services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
        - ..:/workspaces/steam-achievement-rag:cached
    command: sleep infinity
    network_mode: service:db
    env_file:
      # repo-root .env, gitignored — copy .env.example to .env and fill in
      # STEAM_API_KEY before first run. required: false so a fresh clone
      # without .env yet doesn't fail to start.
      - path: ../.env
        required: false
    environment:
      # network_mode: service:db means this container shares the db container's
      # network namespace, so localhost (not "db") is the correct host here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/achievements

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: achievements

volumes:
  postgres-data:
